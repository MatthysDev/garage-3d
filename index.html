<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garage 3D</title><meta name="description" content="Les voitures de la famille en 3D : pièces, pannes, tutos."><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0d1013"><script>document.documentElement.dataset.theme=(()=>{try{return localStorage.getItem('theme')}catch(e){}})()||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script><link rel="stylesheet" href="base.css?11"><style>
main{max-width:1100px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 18px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1{font-size:34px;letter-spacing:-.03em;margin:0}h2{font-size:24px;letter-spacing:-.02em;margin:0 0 2px}p{margin:0;color:var(--mu)}#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}.v{display:block;background:var(--pn);border:1px solid var(--ln);border-radius:18px;overflow:hidden;color:var(--tx);text-decoration:none}.v img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#0d1013}.v div{padding:16px 18px 18px}.v b{display:inline-block;margin-top:14px;background:var(--ac);color:var(--on);border-radius:9px;padding:10px 16px}footer{margin-top:32px;font-size:13px;color:var(--mu)}</style></head><body><main><header><h1>Garage 3D</h1><button id="t" aria-label="Thème clair ou sombre">◐</button></header><div id="g"></div><footer>Site personnel, sans lien avec les constructeurs. Formes redessinées et indicatives : ne pas mesurer sur le modèle. Tes notes et tes photos restent sur ton appareil.</footer></main><script>
fetch('vehicules.json').then(r=>r.json()).then(L=>{for(const v of L){const e=(t,x)=>{const n=document.createElement(t);if(x)n.textContent=x;return n};const a=e('a');a.className='v';a.href=v.id+'/';const i=e('img');i.src=v.id+'/photo.webp';i.alt=v.nom+' en 3D';const d=e('div');d.append(e('h2',v.nom),e('p',v.detail),e('b','Ouvrir en 3D'));a.append(i,d);g.append(a)}}).catch(()=>{g.textContent='Liste des voitures indisponible. Recharge la page.'});
t.onclick=()=>{const h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
